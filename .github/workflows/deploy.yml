# Test, build e pubblicazione su GitHub Pages (gratuito).
# - push su main  → test + build + deploy
# - pull request  → solo test + build (nessuna pubblicazione)
# - manuale       → scheda Actions → "Deploy su GitHub Pages" → Run workflow
#
# Prima volta: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un solo deploy alla volta; non interrompe un deploy già in corso
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: App Android (APK) dal ramo "apk"
        # il workflow «App Android (APK)» compila l'APK e lo consegna sul ramo apk: qui finisce nel sito
        run: |
          mkdir -p public/download
          if git fetch --depth 1 origin apk 2>/dev/null; then
            git show FETCH_HEAD:contingente-sicilia.apk > public/download/contingente-sicilia.apk
            ls -la public/download
          else
            echo "APK non ancora compilato: il sito viene pubblicato senza."
          fi

      - name: Test
        run: npm test

      - name: Percorso base del sito
        # https://<utente>.github.io/<repository>/  → BASE_PATH=/<repository>/
        # repository "<utente>.github.io"             → BASE_PATH=/
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Percorso base: $BASE"

      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}

      - name: Controlla i dati pubblicati
        run: |
          test -f dist/data/demo.json || { echo "::error::Manca data/demo.json"; exit 1; }
          node -e "
            const fs = require('fs');
            const d = require('./dist/data/demo.json');
            if (!d.versione || !Array.isArray(d.records)) throw new Error('demo.json non valido');
            console.log('demo.json:', d.records.length, 'schede');
            if (fs.existsSync('./dist/data/soci.json')) {
              const s = require('./dist/data/soci.json');
              if (s.formato !== 'consulta-soci-1' || !s.cifrato?.dati) throw new Error('soci.json non valido o non cifrato');
              console.log('soci.json: versione', s.versione, '(cifrato)');
            } else {
              console.log('soci.json non ancora pubblicato: lo crea il programmatore alla prima pubblicazione dal telefono.');
            }
          "
          # nessun database in chiaro deve finire online
          if [ -f dist/data/db.json ]; then echo "::error::dist/data/db.json in chiaro non deve essere pubblicato"; exit 1; fi

      - name: Configura GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Carica il sito
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
